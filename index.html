const STORAGE_KEY_RECIPES = "recipevault_recipes";
const STORAGE_KEY_APIKEY = "recipevault_api_key";

const loadRecipes = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_RECIPES);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return SAMPLE_RECIPES;
};

const saveRecipes = (recipes) => {
  try {
    localStorage.setItem(STORAGE_KEY_RECIPES, JSON.stringify(recipes));
  } catch (e) {}
};

const getApiKey = () => {
  try {
    return localStorage.getItem(STORAGE_KEY_APIKEY) || "";
  } catch (e) {
    return "";
  }
};

const setApiKey = (key) => {
  try {
    localStorage.setItem(STORAGE_KEY_APIKEY, key);
  } catch (e) {}
};

const API_CALL = async (url, recipeText) => {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("NO_API_KEY");

  const prompt = recipeText
    ? `Analizza questa ricetta e restituisci un JSON strutturato con: title, time, servings, calories, protein, carbs, fat, tags (array), ingredients (array di {amount, unit, name}), steps (array di stringhe). Ricetta: ${recipeText}`
    : `Estrai la ricetta da questo URL e restituisci un JSON con: title, time, servings, calories, protein, carbs, fat, tags (array), ingredients (array di {amount, unit, name}), steps (array di stringhe). URL: ${url}. Se non puoi accedere all'URL, crea una ricetta fittizia plausibile basata sul nome del sito/piatto.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-5",
      max_tokens: 1000,
      messages: [
        {
          role: "user",
          content: `${prompt}\n\nRispondi SOLO con JSON valido, nessun testo extra, nessun markdown.`,
        },
      ],
    }),
  });

  if (!response.ok) {
    const errBody = await response.text();
    throw new Error("API_ERROR: " + response.status + " " + errBody);
  }

  const data = await response.json();
  const text = data.content?.map((b) => b.text || "").join("") || "";
  const clean = text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
};

// ─── MACRO RING ──────────────────────────────────────────────────────────────
const MacroRing = ({ calories, protein, carbs, fat }) => {
  const total = protein * 4 + carbs * 4 + fat * 9 || 1;
  const pP = ((protein * 4) / total) * 283;
  const pC = ((carbs * 4) / total) * 283;
  const pF = ((fat * 9) / total) * 283;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
      <div style={{ position: "relative", width: 80, height: 80 }}>
        <svg width="80" height="80" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="none" stroke="#eee" strokeWidth="10" />
          <circle cx="50" cy="50" r="45" fill="none" stroke="#E8642A" strokeWidth="10" strokeDasharray={`${pP} 283`} strokeDashoffset="0" transform="rotate(-90 50 50)" />
          <circle cx="50" cy="50" r="45" fill="none" stroke="#4A7C2F" strokeWidth="10" strokeDasharray={`${pC} 283`} strokeDashoffset={-pP} transform="rotate(-90 50 50)" />
          <circle cx="50" cy="50" r="45" fill="none" stroke="#F5C842" strokeWidth="10" strokeDasharray={`${pF} 283`} strokeDashoffset={-(pP + pC)} transform="rotate(-90 50 50)" />
        </svg>
        <div style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%,-50%)", textAlign: "center" }}>
          <div style={{ fontSize: 16, fontWeight: 800, color: COLORS.green }}>{calories}</div>
          <div style={{ fontSize: 9, color: COLORS.muted }}>kcal</div>
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {[["🥩", "Proteine", protein + "g", "#E8642A"], ["🌾", "Carb", carbs + "g", "#4A7C2F"], ["🧈", "Grassi", fat + "g", "#F5C842"]].map(([ic, label, val, col]) => (
          <div key={label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 12 }}>{ic}</span>
            <span style={{ fontSize: 11, color: COLORS.muted, width: 55 }}>{label}</span>
            <span style={{ fontSize: 12, fontWeight: 700, color: col }}>{val}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

// ─── RECIPE DETAIL ───────────────────────────────────────────────────────────
const RecipeDetail = ({ recipe, onBack, onDelete }) => {
  const [tab, setTab] = useState("ingredienti");

  const ratio = servings / recipe.servings;

        <img src={recipe.image} alt={recipe.title} style={{ width: "100%", height: 260, objectFit: "cover" }} />

        <button onClick={onBack} style={{ position: "absolute", top: 16, left: 16, background: "rgba(255,255,255,0.9)", border: "none", borderRadius: "50%", width: 40, height: 40, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="arrow_left" size={18} color={COLORS.green} />
        </button>
        <button onClick={() => { if (confirm("Eliminare questa ricetta?")) { onDelete(recipe.id); onBack(); } }} style={{ position: "absolute", top: 16, right: 16, background: "rgba(255,255,255,0.9)", border: "none", borderRadius: "50%", width: 40, height: 40, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="x" size={18} color={COLORS.accent} />
        </button>
        <div style={{ position: "absolute", bottom: 16, left: 16, right: 16 }}>
          <div style={{ background: "rgba(255,255,255,0.9)", backdropFilter: "blur(8px)", borderRadius: 8, padding: "3px 10px", display: "inline-flex", alignItems: "center", gap: 4, fontSize: 12, fontWeight: 600, color: COLORS.green, marginBottom: 8 }}>
            {recipe.sourceIcon} {recipe.source}
          </div>
          <h2 style={{ margin: 0, color: "white", fontSize: 24, fontWeight: 800, textShadow: "0 2px 8px rgba(0,0,0,0.4)" }}>{recipe.title}</h2>
        </div>
      </div>

      <div style={{ padding: "20px 20px 0" }}>
        <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
          {[["clock", recipe.time], ["flame", recipe.calories + " kcal"]].map(([ic, val]) => (
            <div key={ic} style={{ flex: 1, background: COLORS.card, borderRadius: 14, padding: "12px 16px", display: "flex", alignItems: "center", gap: 8, boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}>

            </div>

        </div>

        <div style={{ background: COLORS.card, borderRadius: 20, padding: 20, marginBottom: 20, boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.green, marginBottom: 14 }}>Valori Nutrizionali · per porzione</div>
          <MacroRing calories={Math.round(recipe.calories * ratio)} protein={Math.round(recipe.protein * ratio)} carbs={Math.round(recipe.carbs * ratio)} fat={Math.round(recipe.fat * ratio)} />
        </div>

        <div style={{ background: COLORS.card, borderRadius: 20, padding: "14px 20px", marginBottom: 20, display: "flex", alignItems: "center", justifyContent: "space-between", boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: COLORS.text }}>Porzioni</span>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <button onClick={() => setServings(Math.max(1, servings - 1))} style={{ width: 32, height: 32, borderRadius: "50%", border: `2px solid ${COLORS.greenBorder}`, background: "white", cursor: "pointer", fontSize: 18, color: COLORS.green, display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
            <span style={{ fontSize: 20, fontWeight: 800, color: COLORS.green, minWidth: 30, textAlign: "center" }}>{servings}</span>
            <button onClick={() => setServings(servings + 1)} style={{ width: 32, height: 32, borderRadius: "50%", border: "none", background: COLORS.green, cursor: "pointer", color: "white", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
          </div>
        </div>

        <div style={{ display: "flex", background: COLORS.card, borderRadius: 14, padding: 4, marginBottom: 20, boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}>
          {["ingredienti", "preparazione"].map((t) => (

            </button>

        </div>

        {tab === "ingredienti" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {recipe.ingredients.map((ing, i) => (
              <div key={i} style={{ background: COLORS.card, borderRadius: 14, padding: "12px 16px", display: "flex", alignItems: "center", gap: 12, boxShadow: "0 1px 6px rgba(0,0,0,0.05)" }}>

                  {ing.amount !== "q.b." ? (parseFloat(ing.amount) * ratio).toFixed(String(ing.amount).includes(".") ? 1 : 0) : "q.b."} {ing.unit}
                </div>

            ))}

        )}

        {tab === "preparazione" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {recipe.steps.map((step, i) => (
              <div key={i} style={{ background: COLORS.card, borderRadius: 16, padding: "16px", display: "flex", gap: 14, boxShadow: "0 1px 6px rgba(0,0,0,0.05)" }}>

                  <span style={{ color: "white", fontWeight: 800, fontSize: 14 }}>{i + 1}</span>
                </div>
                <p style={{ margin: 0, fontSize: 14, color: COLORS.text, lineHeight: 1.6 }}>{step}</p>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

          onChange={(e) => setKey(e.target.value)}
          placeholder="sk-ant-..."
          style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: `2px solid ${COLORS.greenBorder}`, background: COLORS.card, fontSize: 14, color: COLORS.text, outline: "none", boxSizing: "border-box", fontFamily: "inherit" }}
        />
        <button
          onClick={handleSave}
          disabled={!key.trim()}
          style={{ marginTop: 16, width: "100%", padding: "14px", background: !key.trim() ? COLORS.greenBorder : COLORS.green, color: "white", border: "none", borderRadius: 14, fontSize: 15, fontWeight: 700, cursor: !key.trim() ? "not-allowed" : "pointer" }}
        >
          Salva
        </button>
      </div>
    </div>
  );
};

// ─── ADD RECIPE MODAL ────────────────────────────────────────────────────────
const AddRecipeModal = ({ onClose, onSave, onNeedApiKey }) => {
  const [mode, setMode] = useState("url");
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const handle = async () => {
    if (!input.trim()) return;
    if (!getApiKey()) {
      onNeedApiKey();
      return;
    }
    setLoading(true);
    setError("");
    try {
      const data = mode === "url"
        ? await API_CALL(input.trim(), null)
        : await API_CALL(null, input.trim());

      const sources = { tiktok: ["TikTok", "🎵"], instagram: ["Instagram", "📸"], youtube: ["YouTube", "▶️"], facebook: ["Facebook", "👤"] };
      let source = ["Web", "🌐"];
      for (const [k, v] of Object.entries(sources)) {
        if (input.toLowerCase().includes(k)) { source = v; break; }
      }

      onSave({
        id: Date.now(),
        ...data,
        source: source[0],
        sourceIcon: source[1],
        image: `https://images.unsplash.com/photo-${1512621776951 + Math.floor(Math.random() * 1000000)}?w=400&q=80`,
        saved: true,
      });
    } catch (e) {
      console.error(e);
      if (String(e.message).includes("NO_API_KEY")) {
        onNeedApiKey();
      } else {
        setError("Impossibile estrarre la ricetta. Verifica la API key nelle impostazioni, o prova con il testo direttamente.");
      }
    }
    setLoading(false);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 100, display: "flex", alignItems: "flex-end" }}>
      <div style={{ background: COLORS.bg, borderRadius: "28px 28px 0 0", width: "100%", padding: "24px 20px 40px", maxHeight: "85vh", overflowY: "auto", boxSizing: "border-box" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
          <h2 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: COLORS.green }}>✨ Aggiungi Ricetta</h2>
          <button onClick={onClose} style={{ background: COLORS.greenLight, border: "none", borderRadius: "50%", width: 36, height: 36, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="x" size={16} color={COLORS.green} />
          </button>
        </div>

        <div style={{ display: "flex", background: COLORS.card, borderRadius: 14, padding: 4, marginBottom: 20 }}>
          {[["url", "🔗 Link / URL"], ["text", "📝 Testo ricetta"]].map(([m, label]) => (
            <button key={m} onClick={() => setMode(m)} style={{ flex: 1, padding: "10px", border: "none", borderRadius: 10, cursor: "pointer", background: mode === m ? COLORS.green : "transparent", color: mode === m ? "white" : COLORS.muted, fontWeight: 600, fontSize: 13, transition: "all 0.2s" }}>
              {label}
            </button>
          ))}
        </div>

        {mode === "url" && (
          <div style={{ marginBottom: 16 }}>
            <p style={{ fontSize: 12, color: COLORS.muted, margin: "0 0 10px" }}>Funziona con:</p>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {[["🎵", "TikTok"], ["📸", "Instagram"], ["▶️", "YouTube"], ["👤", "Facebook"], ["🌐", "Siti cucina"]].map(([ic, name]) => (
                <span key={name} style={{ background: COLORS.card, border: `1px solid ${COLORS.greenBorder}`, borderRadius: 20, padding: "5px 12px", fontSize: 12, color: COLORS.green, fontWeight: 600 }}>{ic} {name}</span>
              ))}
            </div>
          </div>
        )}

        {mode === "url" ? (
          <input
            value={input}
            onChange={(e) => setInput(e.target.value)}
            placeholder="Incolla il link qui... (es. tiktok.com/...)"
            style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: `2px solid ${COLORS.greenBorder}`, background: COLORS.card, fontSize: 14, color: COLORS.text, outline: "none", boxSizing: "border-box", fontFamily: "inherit" }}
          />
        ) : (
          <textarea
            value={input}
            onChange={(e) => setInput(e.target.value)}
            placeholder="Incolla il testo della ricetta (ingredienti, procedimento, ecc.)..."
            rows={6}
            style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: `2px solid ${COLORS.greenBorder}`, background: COLORS.card, fontSize: 14, color: COLORS.text, outline: "none", resize: "vertical", boxSizing: "border-box", fontFamily: "inherit" }}
          />
        )}

        {error && <p style={{ color: "#E8642A", fontSize: 13, marginTop: 10 }}>{error}</p>}

        <button
          onClick={handle}
          disabled={loading || !input.trim()}
          style={{ marginTop: 16, width: "100%", padding: "16px", background: loading || !input.trim() ? COLORS.greenBorder : COLORS.green, color: "white", border: "none", borderRadius: 16, fontSize: 16, fontWeight: 700, cursor: loading || !input.trim() ? "not-allowed" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, transition: "background 0.2s" }}
        >
          {loading ? (
            <>
              <div style={{ width: 18, height: 18, border: "2px solid rgba(255,255,255,0.4)", borderTopColor: "white", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
              Analisi AI in corso...
            </>
          ) : (
            <><Icon name="sparkle" size={18} color="white" /> Estrai Ricetta con AI</>
          )}
        </button>

        <p style={{ textAlign: "center", fontSize: 11, color: COLORS.muted, marginTop: 12 }}>
          L'AI analizzerà il contenuto ed estrarrà automaticamente ingredienti, passi e calorie
        </p>
      </div>
    </div>
  );
};

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [recipes, setRecipes] = useState(loadRecipes());
  const [selected, setSelected] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("Tutti");
  const [hasKey, setHasKey] = useState(!!getApiKey());

  useEffect(() => {
    saveRecipes(recipes);
  }, [recipes]);

  useEffect(() => {
    if (!getApiKey()) setShowSettings(true);
  }, []);

  const filtered = recipes.filter((r) => {
    const matchSearch = r.title.toLowerCase().includes(search.toLowerCase()) || r.tags.some((t) => t.toLowerCase().includes(search.toLowerCase()));
    const matchFilter = filter === "Tutti" || r.tags.includes(filter) || r.source === filter;
    return matchSearch && matchFilter;
  });

  const allTags = ["Tutti", ...new Set(recipes.flatMap((r) => r.tags))];

  const handleSave = (recipe) => {
    setRecipes((prev) => [recipe, ...prev]);
    setShowAdd(false);
  };

  const handleDelete = (id) => {
    setRecipes((prev) => prev.filter((r) => r.id !== id));
  };

  if (selected) return <RecipeDetail recipe={selected} onBack={() => setSelected(null)} onDelete={handleDelete} />;

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh", maxWidth: 420, margin: "0 auto", fontFamily: "'Georgia', 'Times New Roman', serif", position: "relative" }}>
      <style>{`
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        * { -webkit-tap-highlight-color: transparent; }
      `}</style>

      <div style={{ background: COLORS.bg, padding: "20px 20px 0", position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 800, color: COLORS.green }}>🥑 RecipeVault</div>
            <div style={{ fontSize: 12, color: COLORS.muted }}>{recipes.length} ricette salvate</div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button
              onClick={() => setShowSettings(true)}
              style={{ background: COLORS.card, border: `1px solid ${COLORS.greenBorder}`, borderRadius: 16, padding: "10px 12px", cursor: "pointer", display: "flex", alignItems: "center" }}
            >
              <Icon name="settings" size={16} color={COLORS.green} />
            </button>
            <button
              onClick={() => setShowAdd(true)}
              style={{ background: COLORS.green, border: "none", borderRadius: 16, padding: "10px 18px", color: "white", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}
            >
              <Icon name="plus" size={16} color="white" /> Aggiungi
            </button>
          </div>
        </div>

        <div style={{ position: "relative", marginBottom: 14 }}>
          <div style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)" }}>
            <Icon name="search" size={16} color={COLORS.muted} />
          </div>
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Cerca ricette, ingredienti..."
            style={{ width: "100%", padding: "12px 16px 12px 42px", borderRadius: 14, border: "none", background: COLORS.card, fontSize: 14, color: COLORS.text, outline: "none", boxSizing: "border-box", fontFamily: "inherit", boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}
          />
        </div>

        <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 12, scrollbarWidth: "none" }}>
          {allTags.map((t) => (
            <button key={t} onClick={() => setFilter(t)} style={{ flexShrink: 0, padding: "6px 14px", borderRadius: 20, border: "none", background: filter === t ? COLORS.green : COLORS.card, color: filter === t ? "white" : COLORS.muted, fontWeight: 600, fontSize: 12, cursor: "pointer", transition: "all 0.2s", boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
              {t}
            </button>
          ))}
        </div>
      </div>

      <div style={{ padding: "0 16px 32px" }}>
        {filtered.length === 0 ? (
          <div style={{ textAlign: "center", padding: "60px 20px" }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>🔍</div>
            <p style={{ color: COLORS.muted, fontSize: 15 }}>Nessuna ricetta trovata</p>
            <button onClick={() => setShowAdd(true)} style={{ background: COLORS.green, color: "white", border: "none", borderRadius: 14, padding: "12px 24px", fontSize: 14, fontWeight: 700, cursor: "pointer", marginTop: 12 }}>
              Aggiungi la prima ricetta
            </button>
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, animation: "slideUp 0.4s ease" }}>
            {filtered.map((r) => (
              <RecipeCard key={r.id} recipe={r} onClick={() => setSelected(r)} />
            ))}
          </div>
        )}
      </div>

      {showAdd && <AddRecipeModal onClose={() => setShowAdd(false)} onSave={handleSave} onNeedApiKey={() => { setShowAdd(false); setShowSettings(true); }} />}
      {showSettings && <SettingsModal onClose={() => setShowSettings(false)} onSaved={() => setHasKey(true)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
